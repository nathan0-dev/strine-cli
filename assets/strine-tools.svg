<text x="28" y="297" fill="#565F89" font-size="11">TOOL</text>
<text x="190" y="297" fill="#565F89" font-size="11">WHAT IT DOES</text>
<text x="560" y="297" fill="#565F89" font-size="11">CREDENTIAL</text>
<line x1="28" y1="305" x2="832" y2="305" stroke="#20212E"/>
<text x="28" y="329" fill="#7DCFFF" font-size="13">sql</text>
<text x="190" y="329" fill="#C0CAF5" font-size="13">Runs a read-only (SELECT) SQL query</text>
<text x="560" y="329" fill="#E0AF68" font-size="13">missing DATABASE_URL</text>
<line x1="28" y1="335" x2="832" y2="335" stroke="#20212E"/>
<text x="28" y="359" fill="#7DCFFF" font-size="13">slack</text>
<text x="190" y="359" fill="#C0CAF5" font-size="13">Posts a message to a Slack channel</text>
<text x="560" y="359" fill="#E0AF68" font-size="13">missing SLACK_BOT_TOKEN</text>
<line x1="28" y1="365" x2="832" y2="365" stroke="#20212E"/>
<text x="28" y="389" fill="#7DCFFF" font-size="13">webhook</text>
<text x="190" y="389" fill="#C0CAF5" font-size="13">Sends a POST with a JSON payload</text>
<text x="560" y="389" fill="#565F89" font-size="13">—</text>
<line x1="28" y1="395" x2="832" y2="395" stroke="#20212E"/>
<text x="28" y="419" fill="#7DCFFF" font-size="13">http_request</text>
<text x="190" y="419" fill="#C0CAF5" font-size="13">Generic HTTP call to any REST API</text>
<text x="560" y="419" fill="#565F89" font-size="13">—</text>
<line x1="28" y1="425" x2="832" y2="425" stroke="#20212E"/>
<text x="28" y="449" fill="#7DCFFF" font-size="13">web_search</text>
<text x="190" y="449" fill="#C0CAF5" font-size="13">Searches the web for current info</text>
<text x="560" y="449" fill="#9ECE6A" font-size="13">ok</text>
<line x1="28" y1="455" x2="832" y2="455" stroke="#20212E"/>
<text x="28" y="479" fill="#7DCFFF" font-size="13">send_email</text>
<text x="190" y="479" fill="#C0CAF5" font-size="13">Sends an email</text>
<text x="560" y="479" fill="#E0AF68" font-size="13">missing RESEND_API_KEY</text>
<line x1="28" y1="485" x2="832" y2="485" stroke="#20212E"/>
<text x="28" y="509" fill="#7DCFFF" font-size="13">file_read</text>
<text x="190" y="509" fill="#C0CAF5" font-size="13">Reads a local file</text>
<text x="560" y="509" fill="#565F89" font-size="13">—</text>
<line x1="28" y1="515" x2="832" y2="515" stroke="#20212E"/>
<text x="28" y="539" fill="#7DCFFF" font-size="13">file_write</text>
<text x="190" y="539" fill="#C0CAF5" font-size="13">Writes a local file</text>
<text x="560" y="539" fill="#565F89" font-size="13">—</text>
<text x="28" y="573" fill="#565F89" font-size="13">Pick tools when creating an agent, or describe a new one.</text>
