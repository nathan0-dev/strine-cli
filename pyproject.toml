[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strine"
version = "0.1.0"
description = "Describe your agent. Get it running. No config, no dashboard."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ai-agent", "llm", "cli", "tool-calling", "function-calling", "claude", "gpt", "gemini", "groq", "openrouter", "agent-builder"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "sqlalchemy>=2.0",
    "sqlglot>=25.0",
    "requests>=2.31",
    "rich>=13.0",
    "google-genai>=2.0",
    "openai>=1.0",
]

[project.urls]
Homepage = "https://github.com/nathan0-dev/strine-cli"
Repository = "https://github.com/nathan0-dev/strine-cli"
Issues = "https://github.com/nathan0-dev/strine-cli/issues"

[project.scripts]
strine = "strine.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["strine*"]
