[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strine"
version = "0.1.0"
description = "Describe your agent. Get it running. No config, no dashboard."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "sqlalchemy>=2.0",
    "requests>=2.31",
]

[project.scripts]
strine = "strine.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["strine*"]
